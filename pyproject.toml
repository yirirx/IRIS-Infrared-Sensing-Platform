[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-infrared-sensing"
version = "0.1.0"
description = "Reproducible simulation of modulated infrared signal detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "9_Firmware_and_Software/python"}

[tool.setuptools.packages.find]
where = ["9_Firmware_and_Software/python"]

[tool.pytest.ini_options]
pythonpath = ["9_Firmware_and_Software/python"]
testpaths = ["tests"]
