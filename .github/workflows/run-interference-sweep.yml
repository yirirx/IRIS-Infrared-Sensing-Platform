name: IRIS interference robustness experiment

on:
  push:
    paths:
      - "9_Firmware_and_Software/python/iris_sim/experiment.py"
      - "9_Firmware_and_Software/python/iris_sim/sweep.py"
      - "9_Firmware_and_Software/python/iris_sim/mismatch.py"
      - "9_Firmware_and_Software/python/iris_sim/seed_stability.py"
      - "9_Firmware_and_Software/python/iris_sim/frequency_study.py"
      - "9_Firmware_and_Software/python/iris_sim/signal_model.py"
      - "9_Firmware_and_Software/python/iris_sim/detectors.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/run-interference-sweep.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: pytest
      - name: Run controlled interference sweep
        run: |
          python -m iris_sim.sweep \
            --output 5_Simulations/interference_sweep \
            --trials 1000 \
            --calibration-trials 5000 \
            --validation-trials 5000 \
            --seed 20261015
      - name: Run clean-threshold mismatch experiment
        run: |
          python -m iris_sim.mismatch \
            --output 5_Simulations/mismatched_calibration \
            --trials 1000 \
            --calibration-trials 5000 \
            --validation-trials 5000 \
            --seed 20261020
      - name: Run repeated-seed stability check
        run: python -m iris_sim.seed_stability --output 5_Simulations/seed_stability --trials 1000 --calibration-trials 5000 --validation-trials 5000
      - name: Run interference frequency sensitivity study
        run: python -m iris_sim.frequency_study --output 5_Simulations/frequency_sensitivity --trials 1000 --calibration-trials 5000 --validation-trials 5000
      - name: Commit reproducible simulation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 5_Simulations/interference_sweep 5_Simulations/mismatched_calibration 5_Simulations/seed_stability 5_Simulations/frequency_sensitivity
          if git diff --cached --quiet; then
            echo "Simulation outputs are unchanged."
          else
            git commit -m "Add reproducible interference sweep results [skip ci]"
            git push
          fi
