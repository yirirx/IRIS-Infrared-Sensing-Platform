<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">IRIS simulated detection rate versus SNR</title><desc id="desc">Nine simulated SNR points from minus 12 to plus 12 dB, 100 trials each. Matched filter detection is 1.0 across these trials; energy detection falls after minus 9 dB. Results are illustrative and depend on the initial model and thresholds.</desc>
<rect width="900" height="430" fill="#ffffff"/><text x="450" y="30" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#172033">Detection Rate vs SNR — Simulation</text>
<g stroke="#d8dee9" stroke-width="1"><line x1="90" y1="70" x2="830" y2="70"/><line x1="90" y1="140" x2="830" y2="140"/><line x1="90" y1="210" x2="830" y2="210"/><line x1="90" y1="280" x2="830" y2="280"/><line x1="90" y1="350" x2="830" y2="350"/></g>
<g stroke="#344054" stroke-width="1.5"><line x1="90" y1="70" x2="90" y2="350"/><line x1="90" y1="350" x2="830" y2="350"/></g>
<g fill="#344054" font-family="Arial,sans-serif" font-size="12" text-anchor="end"><text x="78" y="354">0.0</text><text x="78" y="284">0.25</text><text x="78" y="214">0.5</text><text x="78" y="144">0.75</text><text x="78" y="74">1.0</text></g>
<g fill="#344054" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><text x="90" y="372">-12</text><text x="182.5" y="372">-9</text><text x="275" y="372">-6</text><text x="367.5" y="372">-3</text><text x="460" y="372">0</text><text x="552.5" y="372">3</text><text x="645" y="372">6</text><text x="737.5" y="372">9</text><text x="830" y="372">12</text></g>
<text x="460" y="405" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#172033">SNR (dB, simulated parameter)</text><text x="22" y="210" transform="rotate(-90 22 210)" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#172033">Detection rate</text>
<polyline fill="none" stroke="#c2410c" stroke-width="3" points="90,70 182.5,70 275,347.2 367.5,350 460,350 552.5,350 645,350 737.5,350 830,350"/>
<polyline fill="none" stroke="#2563eb" stroke-width="3" points="90,70 182.5,70 275,70 367.5,70 460,70 552.5,70 645,70 737.5,70 830,70"/>
<g fill="#c2410c"><circle cx="90" cy="70" r="4"/><circle cx="182.5" cy="70" r="4"/><circle cx="275" cy="347.2" r="4"/><circle cx="367.5" cy="350" r="4"/><circle cx="460" cy="350" r="4"/><circle cx="552.5" cy="350" r="4"/><circle cx="645" cy="350" r="4"/><circle cx="737.5" cy="350" r="4"/><circle cx="830" cy="350" r="4"/></g><g fill="#2563eb"><circle cx="90" cy="70" r="4"/><circle cx="182.5" cy="70" r="4"/><circle cx="275" cy="70" r="4"/><circle cx="367.5" cy="70" r="4"/><circle cx="460" cy="70" r="4"/><circle cx="552.5" cy="70" r="4"/><circle cx="645" cy="70" r="4"/><circle cx="737.5" cy="70" r="4"/><circle cx="830" cy="70" r="4"/></g>
<line x1="580" y1="45" x2="610" y2="45" stroke="#c2410c" stroke-width="3"/><text x="618" y="49" font-family="Arial,sans-serif" font-size="12" fill="#172033">Energy detector</text><line x1="730" y1="45" x2="760" y2="45" stroke="#2563eb" stroke-width="3"/><text x="768" y="49" font-family="Arial,sans-serif" font-size="12" fill="#172033">Matched filter</text>
<text x="450" y="423" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#667085">Simulation only • 100 trials per SNR • seed 20261013 • not physical measurements</text></svg>